# Réconciliation périodique (spec v1.0 § 8) sur GitHub Actions : second scan de contrôle (`--verify`) en `--dry-run`
# sur les copies GitHub PUBLIQUES des jeux autorisés ; échoue (code ≠ 0) s'il trouve une dérive.
# Déclencheurs : cron (scan périodique), `repository_dispatch` de type `jeu-modifie` (crochet des dépôts de jeux,
# sur leur PR et leur merge) et manuel. LIMITE écrite : un dépôt de jeu ne peut appeler ce crochet qu'avec un jeton
# portant le droit d'écriture sur ce dépôt ; aucun jeu n'en porte aujourd'hui (pas de jeton large chez les jeux).
# Woodpecker (.woodpecker/scan.yml) tourne EN PLUS. Aucun secret ; la synchronisation complète et la PR se font
# depuis Zalman, où vivent les accès.
name: scan
on:
  schedule:
    - cron: "23 */6 * * *"
  repository_dispatch:
    types: [jeu-modifie]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/scan.yml", "tools/discovery/**", "catalog/sources.json"]
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-24.04
    container: python:3.13-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: git config --global --add safe.directory '*'
      - run: pip install --quiet --disable-pip-version-check -r requirements.txt
      - run: ./assetctl scan-repos --verify --dry-run --provider github --only opencade opencadkid echecs-kid pestouille-rpg capsule-panic six-de-chaque cozy-room-sort petit-astronome tictac --json
