# Usine (registre des specs REG-003 et catalogue des briques BB-001) sur GitHub Actions. Woodpecker (.woodpecker/)
# tourne EN PLUS sur la forge ; il ne remplace pas ce workflow. Contrôles exigés par la spec : validate, resolve,
# impact, export (REG-003), et bbctl consommé par GitHub Actions (BB-001).
name: usine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  registre:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt pyyaml
      - name: validate
        run: |
          ./specctl --json validate
          ./specctl --json verify
      - name: resolve
        run: |
          for f in specs/registry/SPEC-*.json; do
            p=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["project"])' "$f")
            ./specctl --json resolve --project "$p" > /dev/null || { echo "resolve $p en échec"; exit 1; }
          done
      - name: impact
        run: |
          for f in specs/registry/SPEC-*.json; do
            s=$(basename "$f" .json)
            ./specctl --json impact --spec "$s" > /dev/null || { echo "impact $s en échec"; exit 1; }
          done
      - name: export
        run: ./specctl --json export --format json > registre-export.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registre-export
          path: registre-export.json
  briques:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt pyyaml
      - name: bbctl validate
        run: ./bbctl validate --all --json
      - name: oracles bbctl
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          python3 -m unittest discover -s tests/blocks -t . -p 'test_*.py'
