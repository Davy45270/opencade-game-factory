# Validation du registre sur GitHub Actions (spec v1.0 § 3 et § 8, REG-06 ; EXT-002 § 2 « validate »).
# « On utilise GitHub » (David 22/11) : ce workflow s'applique tel qu'écrit ; Woodpecker (.woodpecker/validate.yml
# et controles.yml) tourne EN PLUS sur la forge, avec les mêmes commandes. Aucun secret.
# Conteneur python:3.13-slim, comme Woodpecker : même Python, même ImageMagick 7 (`magick`).
name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    container: python:3.13-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git imagemagick ca-certificates >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - run: pip install --quiet --disable-pip-version-check -r requirements.txt -r requirements-ci.txt
      - name: tests unitaires
        run: python3 -m pytest -n 4 -q -p no:cacheprovider tests/unit
      - name: tests d'acceptation (AT-01…AT-15)
        run: python3 -m pytest -n 4 -q -p no:cacheprovider tests/acceptance
  registre:
    runs-on: ubuntu-24.04
    container: python:3.13-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - run: pip install --quiet --disable-pip-version-check -r requirements.txt
      - name: validate (schémas, IDs, références, empreintes, dimensions, licences)
        run: ./assetctl validate --json > /dev/null
      - name: contrôle de PR (AT-10, base = point de divergence)
        if: github.event_name == 'pull_request'
        run: ./assetctl validate --base "$(git merge-base "origin/${{ github.base_ref }}" HEAD)" --json > /dev/null
      - name: atlas
        run: |
          N=0
          for f in atlases/*.json; do [ -e "$f" ] || continue; ./assetctl validate-atlas "$f" --json > /dev/null || exit 1; N=$((N + 1)); done
          echo "atlas validés $N"
      - name: licences externes (EXT-001)
        run: ./assetctl external audit-licenses --json > /dev/null
      - name: doublons
        run: ./assetctl duplicates --json > /dev/null
      - name: niveaux (EXT-002 level validate, catalogue entier)
        # Le nom de la commande de la spec : `level validate` ; un `fail` bloque, un `inconclusive` est compté.
        run: python3 scripts/niveaux-valider.py
      - name: catalogue web des niveaux à jour (LV-20)
        run: ./assetctl level site --out generated/niveaux --check --json > /dev/null
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact
