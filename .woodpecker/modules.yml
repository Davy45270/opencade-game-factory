# Modules blocks/ (BB-001, `bbctl`), ci/ (gabarit CI des jeux) et documentation générée (DOC-001, scripts/docs_generees.py) : leurs oracles ne tournaient dans aucun pipeline
# (anomalie relevée le 21/11, HL-525). Aucun secret. Rejeu local : scripts/ci-local.sh modules
#
# node et PyYAML sont installés pour que les tests du gabarit ne se sautent pas (skipUnless node / PyYAML) : seul
# test_agents_md peut se sauter (.codex-logs est gitignoré). L'étape compte les tests sautés et échoue au-delà de 1.
labels:
  host: tank01

when:
  - event: push
    branch: [main, usine]
  - event: [pull_request, manual]

steps:
  - name: dependances
    image: &py harbor.pingfr.duckdns.org/dockerhub/library/python:3.13-slim
    pull: true
    commands:
      - python3 -m venv .venv
      - .venv/bin/pip install --quiet --disable-pip-version-check -r requirements.txt pyyaml

  - name: oracles-bbctl-et-gabarit
    image: *py
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs >/dev/null
      - git config --global --add safe.directory '*'
      - git config --global user.name ci && git config --global user.email ci@localhost
      - . .venv/bin/activate
      - python3 -m unittest discover -s tests/blocks -t . -p 'test_*.py'
      - python3 -m unittest discover -s tests/agents -t . -p 'test_*.py'
      - python3 -m unittest discover -s tests/github -t . -p 'test_*.py'
      - python3 -m unittest discover -s tests/docs -t . -p 'test_*.py'
      - python3 -m unittest discover -s tests/ci -t . -p 'test_*.py' 2>&1 | tee /tmp/ci.txt
      - grep -q '^OK' /tmp/ci.txt
      - >-
        SAUTES=$(grep -o 'skipped=[0-9]*' /tmp/ci.txt | cut -d= -f2);
        test "$${SAUTES:-0}" -le 1 || { echo "tests sautés - $$SAUTES"; exit 1; }

  # DOC-001 (anomalie HL-525, lot usine3) : les pages de generated/docs/ sont refaites depuis leurs sources ; une page
  # périmée ou absente fait échouer la PR (code 2). Régénérer : python3 scripts/docs_generees.py
  - name: docs-generees
    image: *py
    commands:
      - . .venv/bin/activate
      - python3 scripts/docs_generees.py --check

  # REG-08 (E108, HL-538) : pages Markdown du catalogue (generated/catalogue/), refaites depuis catalog/ et l'index
  # d'usage ; une page périmée, absente ou en trop fait échouer la PR (code 2). Régénérer : python3 scripts/catalogue_pages.py
  - name: catalogue-pages
    image: *py
    commands:
      - . .venv/bin/activate
      - python3 scripts/catalogue_pages.py --check

  # BB-001 § 9 (matrice E206, E224) : depuis les manifestes JSON du catalogue réel, l'index SQLite FTS5 et le graphe de
  # dépendances se génèrent, puis --check les retrouve identiques (reconstruction déterministe). Rien n'est commité.
  - name: index-briques
    image: *py
    commands:
      - . .venv/bin/activate
      - ./bbctl index --out /tmp/index-briques --json
      - ./bbctl index --out /tmp/index-briques --check --json
      - ./bbctl validate --all --json

  # BB-09 (matrice E222, E210) : SBOM CycloneDX des briques (versions, purl, licences SPDX, dépendances de chaque
  # dépôt consommateur), puis scan de vulnérabilités par trivy sur ce SBOM (base trivy-db par le proxy Harbor).
  # Rapport seulement (--exit-code 0) : les versions non résolues sont listées par bbctl, jamais inventées.
  - name: sbom-briques
    image: *py
    commands:
      - . .venv/bin/activate
      - ./bbctl sbom --out sbom-briques.cdx.json --json

  - name: scan-briques
    image: harbor.pingfr.duckdns.org/dockerhub/aquasec/trivy:0.59.0
    commands:
      - trivy sbom --db-repository harbor.pingfr.duckdns.org/ghcr/aquasecurity/trivy-db:2 --format table --exit-code 0 sbom-briques.cdx.json
