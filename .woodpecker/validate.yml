# Validation du registre (spec §8 « CI du registre ») : tests, JSON Schema, IDs, références,
# empreintes, dimensions/alpha, licences, contrôle de PR d'AT-10, atlas, doublons, secrets.
# Woodpecker et non GitHub Actions : écart validé par David (HL-538, condition 2).
# Aucun secret dans ce pipeline. Rejeu local sans conteneur : scripts/ci-local.sh validate
#
# Image Python officielle par le proxy Harbor. Le .venv vit dans l'espace de travail, partagé par
# les étapes ; git est installé dans chaque étape qui en a besoin (les tests construisent des dépôts
# git de fixture, validate --base lit la base).
# Reste sur tank01 (HL-542) : sur contabo-amd64, ce workflow a pris 46 min contre ~12 ici
# (pipeline 90 : tests-unitaires 1034 s contre 288 s, un seul processus, cœur plus lent).
# Le déplacer seulement si les tests passent en parallèle.
labels:
  host: tank01

when:
  - event: push
    branch: main
  - event: [pull_request, manual]

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.12.1
    settings:
      # Historique complet : validate --base compare ids.json et le catalogue à la branche cible.
      depth: 0
      partial: false
      # La branche cible est récupérée ICI, par le plugin qui détient les identifiants (dépôt privé) :
      # un `git fetch` dans une étape Python, sans identifiants, sortait en 128 (pipeline 18, HL-538).
      fetch_target_branch: true

# Étapes en graphe (HL-542 7-3229) : après `dependances`, toutes tournent en parallèle ; une étape sans
# depends_on démarrerait d'emblée, d'où un depends_on explicite partout. Les tests passent en 4 processus
# (pytest-xdist) : chaque test construit ses fixtures dans un dossier temporaire à lui, et directory_lock()
# ne porte que sur le catalogue de CE dossier.
steps:
  - name: dependances
    image: &py harbor.pingfr.duckdns.org/dockerhub/library/python:3.13-slim
    pull: true
    commands:
      - python3 --version
      - python3 -m venv .venv
      - .venv/bin/pip install --quiet --disable-pip-version-check -r requirements.txt -r requirements-ci.txt
      - .venv/bin/pip freeze

  - name: tests-unitaires
    image: *py
    depends_on: [dependances]
    commands:
      # ImageMagick : le registre rejoue la normalisation déclarée par la recette d'un jeu (outils.magick, L7) ;
      # en CI (variable CI présente) un oracle qui n'a pas magick échoue au lieu de sauter.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git imagemagick >/dev/null
      - magick -version | head -1
      - git config --global --add safe.directory '*'
      - . .venv/bin/activate
      - python3 -m pytest -n 4 -q -p no:cacheprovider tests/unit

  # E085 : AT-01…AT-15 en boîte noire (fixtures git construites par les tests, aucun dépôt réel).
  - name: tests-acceptation
    image: *py
    depends_on: [dependances]
    commands:
      # ImageMagick : le registre rejoue la normalisation déclarée par la recette d'un jeu (outils.magick, L7) ;
      # en CI (variable CI présente) un oracle qui n'a pas magick échoue au lieu de sauter.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git imagemagick >/dev/null
      - magick -version | head -1
      - git config --global --add safe.directory '*'
      - . .venv/bin/activate
      - python3 -m pytest -n 4 -q -p no:cacheprovider tests/acceptance

  # E075-E080 : schémas, unicité des IDs, références, empreintes, dimensions/alpha, licences.
  - name: validate
    image: *py
    depends_on: [dependances]
    commands:
      - . .venv/bin/activate
      - ./assetctl validate --json

  # AT-10 (E120) : tout asset nouveau porte creation.searchReceipt ; ids.json en ajout seul.
  # Sans base lisible, le contrôle ne prouve rien : échec voulu plutôt qu'un vert muet.
  - name: controle-de-pr
    image: *py
    depends_on: [dependances]
    when:
      - event: pull_request
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
      - git config --global --add safe.directory '*'
      - . .venv/bin/activate
      - CIBLE="$${CI_COMMIT_TARGET_BRANCH:?branche cible inconnue}"
      # origin/<cible> vient de l'étape clone (fetch_target_branch) ; absente, le contrôle échoue (pas de vert muet).
      - git rev-parse --verify -q "refs/remotes/origin/$$CIBLE^{commit}" >/dev/null || { echo "origin/$$CIBLE absente du clone"; exit 1; }
      - echo "base origin/$$CIBLE = $(git rev-parse "origin/$$CIBLE")"
      - ./assetctl validate --base "origin/$$CIBLE" --json

  # E083 : chaque atlas exporté du dépôt (transparence, dimensions, références).
  - name: atlas
    image: *py
    depends_on: [dependances]
    commands:
      - . .venv/bin/activate
      - N=0
      - for f in atlases/*.json; do [ -e "$$f" ] || continue; ./assetctl validate-atlas "$$f" --json || exit 1; N=$$((N + 1)); done
      - echo "atlas validés $$N"

  # EXT-001 (E164) : aucune fiche externe ne déclare une licence que son pack n'a pas prouvée.
  # Ses tests d'acceptation EXT-T01…T12 tournent hors ligne dans tests-unitaires (tests/unit/test_ext001.py).
  - name: licences-externes
    image: *py
    depends_on: [dependances]
    commands:
      - . .venv/bin/activate
      - ./assetctl external audit-licenses --json

  # E082 : doublons exacts et similaires proposés, jamais fusionnés.
  - name: doublons
    image: *py
    depends_on: [dependances]
    commands:
      - . .venv/bin/activate
      - ./assetctl duplicates --json

  # E081 : secrets.
  - name: secrets
    image: harbor.pingfr.duckdns.org/dockerhub/zricethezav/gitleaks:v8.30.1
    depends_on: []
    commands:
      - gitleaks detect --source . --no-banner --redact
